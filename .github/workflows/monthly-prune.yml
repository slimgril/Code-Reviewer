name: Monthly Prune

on:
  schedule:
    - cron: '0 18 1 * *'  # 1st of each month 18:00 UTC = Taiwan 02:00
  workflow_dispatch:

jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ANTHROPIC_API_KEY: op://Code-Reviewer/Claude API/api_key

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run prune
        run: python scripts/prune.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AGENT_NOTES.md
          git diff --staged --quiet || git commit -m "chore: monthly prune $(date +%Y-%m-%d)"
          git push
