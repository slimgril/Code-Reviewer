name: Weekly Review

on:
  schedule:
    - cron: '0 18 * * 3'  # Wednesday 18:00 UTC = Taiwan Wednesday 02:00
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run weekly review
        run: python scripts/review.py "weekly scheduled review"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AGENT_NOTES.md
          git diff --staged --quiet || git commit -m "chore: weekly review log $(date +%Y-%m-%d)"
          git push
